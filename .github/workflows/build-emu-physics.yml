name: Build and commit real EMU MuJoCo browser runtime
on:
  push:
    branches: [feature/emu-butterfly-rider]
    paths:
      - 'emu/physics/vendor/**'
      - 'emu/physics/src/**'
      - 'emu/physics/package.json'
      - 'emu/physics/vite.config.js'
      - '.github/workflows/build-emu-physics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned Google DeepMind MuJoCo 3.17.0 WASM
        working-directory: emu/physics
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Sync exact bundled JavaScript size into the optional loader
        working-directory: emu/physics
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync,statSync} from 'node:fs';
          const path='../emu.js';
          const original=readFileSync(path,'utf8');
          const size=statSync('dist/emu-physics.js').size;
          const pattern=/(name:'runtime',.*?bytes:)[0-9]+/;
          if(!pattern.test(original))throw new Error('Runtime manifest entry missing');
          const updated=original.replace(pattern,(_,prefix)=>prefix+size);
          if(updated!==original)writeFileSync(path,updated);
          console.log('Verified runtime size:',size,'bytes');
          JS
      - name: Ensure physics bundle and actual WASM binary exist
        run: |
          test -s emu/physics/dist/emu-physics.js
          find emu/physics/dist -iname '*.wasm' -type f -size +1M | grep -q wasm
          du -h emu/physics/dist/emu-physics.js
          find emu/physics/dist -iname '*.wasm' -type f -exec du -h {} \;
      - name: Commit web-playable compiled engine on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f emu/physics/dist/ emu/emu.js
          if git diff --cached --quiet; then
            echo "Runtime already up-to-date."
          else
            git commit -m "Build browser MuJoCo WASM physics runtime for Meadow"
            git push origin HEAD:refs/heads/feature/emu-butterfly-rider
          fi
